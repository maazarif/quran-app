# Builds the iPhone/iPad app on a Mac, runs it on the iOS Simulator and saves a screenshot.
# Uploading to TestFlight / the App Store needs an Apple Developer account (see ios/README.md).
name: iOS app
on:
  push:
    branches: [main]
    paths: ["ios/**", ".github/workflows/ios.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: macos-15
    defaults: { run: { working-directory: ios } }
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen && xcodegen generate
      - name: Build for iPhone (device, unsigned) — checks it compiles for real phones
        run: xcodebuild -project Mushaf.xcodeproj -scheme Mushaf -sdk iphoneos -configuration Release -derivedDataPath build/device CODE_SIGNING_ALLOWED=NO build | tail -5
      - name: Build for the Simulator
        run: xcodebuild -project Mushaf.xcodeproj -scheme Mushaf -sdk iphonesimulator -configuration Debug -derivedDataPath build/sim CODE_SIGNING_ALLOWED=NO build | tail -5
      - name: Run it on an iPhone simulator and take screenshots
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; print(next(x['udid'] for k in sorted(d, reverse=True) if 'iOS' in k for x in d[k] if x['name'].startswith('iPhone')))")
          echo "Simulator $UDID"; xcrun simctl boot "$UDID"; xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" build/sim/Build/Products/Debug-iphonesimulator/Mushaf.app
          xcrun simctl launch "$UDID" io.github.maazarif.mushaf
          mkdir -p out
          sleep 15; xcrun simctl io "$UDID" screenshot out/iphone-15s.png
          sleep 30; xcrun simctl io "$UDID" screenshot out/iphone-light.png
          xcrun simctl ui "$UDID" appearance dark; sleep 8; xcrun simctl io "$UDID" screenshot out/iphone-dark.png
          xcrun simctl spawn "$UDID" log show --last 3m --style compact --predicate 'subsystem == "io.github.maazarif.mushaf" OR (process == "Mushaf" AND messageType >= 16) OR (process CONTAINS "WebContent" AND messageType >= 16)' > out/app-log.txt 2>&1 || true
          tail -60 out/app-log.txt
          plutil -p build/sim/Build/Products/Debug-iphonesimulator/Mushaf.app/Info.plist | grep -E "UIBackgroundModes|audio|WKAppBound|github|CFBundleIdentifier" > out/info.txt || true
      - uses: actions/upload-artifact@v4
        with: { name: mushaf-ios, path: ios/out }
      - name: Save the screenshots to the native-builds-ios branch
        run: |
          cd out && git init -q -b native-builds-ios && git config user.name "github-actions[bot]" && git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -q -m "iOS screenshots ${GITHUB_SHA::7}"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" native-builds-ios
