# Builds the Android app (a Trusted Web Activity around the published web app).
# - mushaf-test.apk: signed with the test key in the repository; anyone can install it.
# - mushaf-release.aab: for Google Play, signed with the upload key when the ANDROID_UPLOAD_KEY_BASE64 and
#   ANDROID_KEYSTORE_PASSWORD secrets are set (see android/README.md); unsigned otherwise.
# Then it opens the test build on an Android emulator and saves a screenshot.
name: Android app
on:
  push:
    branches: [main]
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: android } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.11.1" }
      - name: Upload key from secrets (if set)
        env:
          KEY_B64: ${{ secrets.ANDROID_UPLOAD_KEY_BASE64 }}
          KEY_PW: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KEY_B64" ]; then
            echo "$KEY_B64" | base64 -d > "$RUNNER_TEMP/upload.p12"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/upload.p12" >> "$GITHUB_ENV"
            echo "ANDROID_KEYSTORE_PASSWORD=$KEY_PW" >> "$GITHUB_ENV"
            echo "Signing the Play build with the upload key."
          else
            echo "::notice::No upload key secrets yet: the Play build (AAB) is unsigned. The test APK is still installable."
          fi
      - run: gradle --no-daemon :app:assemblePreview :app:bundleRelease
      - name: Collect
        run: |
          mkdir -p out
          cp app/build/outputs/apk/preview/app-preview.apk out/mushaf-test.apk
          cp app/build/outputs/bundle/release/app-release.aab out/mushaf-release.aab
          "$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/apksigner" verify --print-certs out/mushaf-test.apk | head -4
          "$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/aapt2" dump badging out/mushaf-test.apk | grep -E "^package|sdkVersion|targetSdkVersion|application-label:" | tee out/badging.txt
      - uses: actions/upload-artifact@v4
        with: { name: mushaf-android, path: android/out }
      - name: Publish on the Releases page (download on a phone to install the test build)
        env: { GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
        run: |
          gh release delete android-latest -y --cleanup-tag 2>/dev/null || true
          gh release create android-latest out/mushaf-test.apk out/mushaf-release.aab --prerelease --target "$GITHUB_SHA" \
            --title "Android app — latest build (${GITHUB_SHA::7})" \
            --notes "**mushaf-test.apk**: install on an Android phone to try the app (allow installs from your browser when asked). **mushaf-release.aab**: upload this one to Google Play (signed with the upload key once the secrets are set; see android/README.md)."

  try-on-emulator:
    needs: build
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/download-artifact@v4
        with: { name: mushaf-android, path: out }
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          profile: pixel_6
          script: |
            adb shell 'echo "_ --disable-fre --no-default-browser-check --no-first-run" > /data/local/tmp/chrome-command-line'
            adb shell am set-debug-app --persistent com.android.chrome
            adb install -r out/mushaf-test.apk
            adb shell am start -n io.github.maazarif.mushaf/com.google.androidbrowserhelper.trusted.LauncherActivity
            sleep 45
            adb exec-out screencap -p > out/android-screenshot.png
            adb shell dumpsys activity activities | grep -E "mResumedActivity|topResumedActivity" | head -3 > out/emulator-activity.txt || true
      - name: Check the website's verification file (Google's Digital Asset Links API)
        run: |
          curl -sS https://maazarif.github.io/.well-known/assetlinks.json > out/assetlinks-live.json || true
          for fp in $(python3 -c "import json;print(' '.join(json.load(open('out/assetlinks-live.json'))[0]['target']['sha256_cert_fingerprints']))" 2>/dev/null); do
            curl -sS "https://digitalassetlinks.googleapis.com/v1/assetlinks:check?source.web.site=https://maazarif.github.io&relation=delegate_permission/common.handle_all_urls&target.android_app.package_name=io.github.maazarif.mushaf&target.android_app.certificate.sha256_fingerprint=$fp" | tr -d '\n' | sed "s/^/$fp /" >> out/assetlinks-check.txt; echo >> out/assetlinks-check.txt
          done
          cat out/assetlinks-check.txt
      - name: Save the screenshot to the native-builds-android branch
        run: |
          mkdir shots && cp out/*.png out/*.txt out/*.json shots/ 2>/dev/null; cd shots
          git init -q -b native-builds-android && git config user.name "github-actions[bot]" && git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -q -m "Android screenshot ${GITHUB_SHA::7}"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" native-builds-android
